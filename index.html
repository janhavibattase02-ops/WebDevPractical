<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="box">
    <header>
        <h1>Student Expense Tracker</h1>
        <p>Track your expenses and manage your budget effectively.</p>
    </header>

    <div class="total-box">
        <h3> Total Expenses</h3>
        <h2 id="total-amount">R.0</h2>
    
    </div>
    <div class="expense form">
        <h3>Add New Expense</h3>
        <form id="expense-form">
            <input type="text" id="expense-name" placeholder="Enter expense name" >
            <label>Amount (R)</label>
            <input type="number" id="expense-amount" placeholder="Amount (R)" >
          
        

        <label>Category</label>
                <select id="expenseCategory">

                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>

                </select>

         <button type="submit" id="addBtn">
                    + Add Expense

                </button>

            </form>
            </div>

            <div class="expense-list">

            <div class="list-header">
                <h2>Your Expenses</h2>

                <select id="categoryFilter">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>

            </div>

            <div id="expenseList">

                <p class="empty-message">
                    No expenses added yet!
                </p>

            </div>

        </div>

        <footer>
            <p>MADE FOR SMARTER STUDENT BUDGETING.</p>
        </footer>

    </div>




</body>
</html>
